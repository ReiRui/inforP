# inforP 信源目录
#
# tier: T1 = 官方一手 | T1_5 = 准官方与研究 | T2 = 媒体/通讯/社交/论坛（只作线索）
# crawl_mode: rss | web | llm_search | browser_profile；rss 优先（逐条带发布时间）
#
# 维护约定
#   - 抓取失败、返回空壳（JS 渲染页）、长期无产出的源直接删除，不要留占位。
#   - 官方页无 RSS 且打不开时，先找该站 RSS；找不到就交给 llm_search 覆盖。
#   - 加源前实测：能取到条目、最新条目日期在合理范围内。
#
version: 2

# 关注方向：驱动抽取提示词里的重要性加权，改这里不需要改代码。
# 下面只是示例值，请替换成你自己的行业与关注方向。
profile:
  focus_label: 示例行业（请替换）
  focus_directions:
    - 示例方向一
    - 示例方向二
    - 供应链与合规相关议题

source_policy:
  confirmation_rules:
  - Official announcements, papers, model cards, code repositories, regulator texts, and company docs are confirmation sources.
  - Media, newsletters, forums, WeChat public accounts, X/Twitter, YouTube, Zhihu, Xueqiu, and NGA are discovery or context sources unless independently confirmed.
  - High-priority items need one primary source or two independent reliable sources. Otherwise label as single-source confirmed or wait-and-watch.
  - China policy items need Chinese original text from gov.cn, ministries, regulators, or official gazettes before medium/high priority conclusions.
  - AI low-confidence items are not pushed. General low-confidence items may enter the wait-and-watch queue with explicit missing evidence.
  report_requirements:
  - Use three main report boards: AI technology and product applications; AI infrastructure and hardware supply chain; policy, industrial capital, and macro/geopolitics.
  - The example profile targets the EDA / semiconductor-IP industry. Raise importance for semiconductor EDA tools, semiconductor IP, chip design flows, verification, physical design, PDK/design rules, layout-design protection, EDA/IP licensing, export controls, litigation, M&A, and domestic-substitution signals.
  - Major AI application breakthroughs outside ordinary AI product news are high-priority candidates. Cover AI for science and engineering, including mathematics, formal proof, physics equations, fluid dynamics, weather/climate, materials, chemistry, biology, drug discovery, robotics, simulation, optimization, control, manufacturing, compilers, software engineering, and EDA-adjacent scientific computing.
  - When an AI system claims to solve or materially advance a recognized hard problem, report the claim and evidence if there is a primary source or reliable coverage. Separate the fact of the claim from community acceptance, reproducibility, credit disputes, and downstream impact.
  - Keep cross-cutting labels for model, product, open source, application, AI4S, mathematics, formal proof, simulation, materials, drug discovery, weather, robotics, GPU, chip, EDA, semiconductor IP, layout design, server, networking, data center, policy, compliance, capital, China, US, geopolitics, and watchlist.
  - Include a 30-second brief with 3-5 standalone bullets before the main sections.
  - For each important item, separate facts from impact judgment and note both confidence levels.
  - Add audience impact tags such as product, compliance, investment, infrastructure, talent, or macro.
  - Use numbered sources in the email body and collect full source links at the end.
  - On Fridays, add weekend watch and next-Monday follow-up items.
  - End each report with coverage scope, uncovered areas, and omission risk notes.
llm_search:
  enabled: true
  daily_queries:
  - id: ai_models_products_breakthroughs
    topic: ai_tech
    query: 'Search the last 36 hours for important AI model, product, benchmark, developer platform, API, agent, multimodal, robotics, open-source, and research breakthroughs. Cover official sites, papers, GitHub, Hugging Face, company blogs, credible newsletters, X/Twitter posts, WeChat public-account discussions, YouTube videos/transcripts, and Chinese AI media. Prefer primary sources and translate all useful non-Chinese material into Simplified Chinese.

      '
  - id: ai_science_engineering_breakthroughs
    topic: ai_tech
    query: 'Search the last 36 hours for major AI application breakthroughs beyond ordinary AI product news: AI for science and engineering, mathematics, formal proof, physics equations, fluid dynamics, weather and climate, materials, chemistry, biology, drug discovery, robotics, simulation, optimization, control, manufacturing, compilers, software engineering, and EDA-adjacent scientific computing. Include claims that AI systems solved or materially advanced recognized hard problems, top-journal or top-conference results, official research posts, papers, code, datasets, model cards, and credible coverage from Nature, Science, Quanta, Scientific American, MIT Technology Review, IEEE Spectrum, and similar sources. Prefer primary sources; separate the existence of a claim from community acceptance, reproducibility, credit disputes, and impact.

      '
  - id: ai_hardware_infrastructure_supply_chain
    topic: ai_hardware
    query: 'Search the last 36 hours for AI hardware and infrastructure news: GPUs, AI accelerators, servers, HBM, advanced packaging, foundry capacity, EDA tools, semiconductor IP, chip design flows, verification, physical design, PDK/design rules, layout-design protection, optical modules, switches, InfiniBand/Ethernet, data centers, power, cooling, cloud capex, delivery lead times, export controls that affect compute supply or semiconductor design tools/IP, and telecom/networking infrastructure for AI. Prefer official announcements, filings, regulator texts, supply-chain disclosures, credible semiconductor reporting, and primary company sources. Also cover lithography and semiconductor equipment makers (ASML, Applied Materials, Lam Research, Tokyo Electron, KLA) and metrology/inspection when they affect leading-edge capacity.'
  - id: ai_policy_capital_industry
    topic: ai_industry_policy
    query: 'Search the last 36 hours for AI regulation, data governance, copyright, public-sector AI procurement, AI investment, M&A, IPO, national AI plans, enterprise adoption, EDA/IP licensing, semiconductor IP disputes, chip-design export controls, and industry strategy. Put hardware supply chain and EDA/IP toolchain details under ai_hardware unless the main point is policy, capital, or macro impact.

      '
  - id: chinese_ai_sources_social_watch
    topic: general_ai
    query: 'Search Chinese AI web media, WeChat public accounts, Zhihu discussions, Bilibili/YouTube transcripts, X/Twitter, and developer communities for AI signals that may not yet appear in English search results. Treat social, forum, and public-account content as observation sources; find official confirmation before promotion.

      '
  - id: global_politics_economy
    topic: global_politics
    query: 'Search the last 36 hours for globally important political, geopolitical, macroeconomic, market, central-bank, sanctions, trade, supply-chain, and energy developments that a China-based technology operator should know. Prioritize official statements, central banks, multilaterals, and major wire services.

      '
  - id: china_policy_regulators
    topic: china_policy
    query: 'Search the last 36 hours for important Chinese central-government, ministry, regulator, financial, tax, technology, platform-economy, industrial, education, talent, and capital-market policies. For any Chinese policy conclusion, locate Chinese original text from official sources whenever possible.

      '
  - id: market_watch_observation
    topic: market_watch
    query: 'Search market-watch sources, including official exchange notices, broker research summaries, reliable financial media, Xueqiu, and authorized forum observation sources such as NGA stock discussions. Forum and community content must stay in wait-and-watch unless confirmed by market data, filings, official notices, or credible financial media.

      '
  weekly_queries:
  - id: weekly_ai_mainline
    topic: ai_tech
    query: 'Summarize the most important AI technology, model, product, application, open-source, and research developments from the previous calendar week, including weekend items not pushed in daily reports. Highlight mainlines, reversals, and follow-up questions.

      '
  - id: weekly_ai_science_engineering_mainline
    topic: ai_tech
    query: 'Summarize the most important AI application breakthroughs from the previous calendar week outside ordinary AI product news, especially AI for science and engineering: mathematics, formal proof, physics, fluid dynamics, weather/climate, materials, chemistry, biology, drug discovery, robotics, simulation, optimization, control, manufacturing, compilers, software engineering, and EDA-adjacent scientific computing. Flag recognized-hard-problem claims and separate confirmed facts from community acceptance, reproducibility, credit disputes, and impact.

      '
  - id: weekly_ai_hardware_mainline
    topic: ai_hardware
    query: 'Summarize the most important AI hardware, GPU, accelerator, server, HBM, advanced packaging, foundry, EDA tools, semiconductor IP, verification, physical design, PDK/design rules, layout-design protection, optical communication, networking, data-center, power, cooling, cloud capex, and major supplier governance developments from the previous calendar week. Always check NVIDIA official newsroom and investor releases for CEO/board changes, investigations, earnings, capital allocation, supply commitments, and AI-factory roadmap changes. Focus on supply-demand changes, toolchain availability, licensing risk, export controls, leadership continuity, and constraints.

      '
  - id: weekly_global_mainline
    topic: global_politics
    query: 'Summarize the most important global politics, macroeconomics, markets, China policy, geopolitics, trade, energy, and AI-adjacent policy developments from the previous calendar week, including weekend items.

      '
  - id: weekly_waitlist_followup
    topic: other
    query: 'Revisit last week''s wait-and-watch queue. For each tracked lead, report whether it was confirmed, corrected, disproven, still pending, or no longer important. Prefer source updates and official confirmations.

      '

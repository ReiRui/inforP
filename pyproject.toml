[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inforp"
version = "0.1.0"
description = "Personal intelligence reporting pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "markdown-it-py>=4.0.0",
  "openai>=1.99.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dateutil>=2.9.0",
  "PyYAML>=6.0.2",
  "rich>=13.7.1",
  "SQLAlchemy>=2.0.32",
  "typer>=0.12.5"
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0"
]
youtube = [
  "google-api-python-client>=2.140.0"
]
dev = [
  "pytest>=8.3.2"
]

[project.scripts]
inforp = "inforp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
